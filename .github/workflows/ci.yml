# CI for the-ai-school-agent
#
# Generated by Blacksmith. You own this file — customize as needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The test suite points DATABASE_URL at a throwaway sqlite file, so no
      # database has to be provisioned before pytest starts.
      - name: Run tests
        run: pytest --cov --cov-report=term-missing
  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # src/api/generated/ is git-ignored, so the typed client is rebuilt from
      # the FastAPI schema before the frontend is type-checked or built.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Export OpenAPI schema
        run: python scripts.py export-openapi ../frontend/_schema.json
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate API client
        run: npx openapi-ts --input _schema.json --output src/api/generated

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
